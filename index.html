<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>타겟 블리츠 - 리버스 과녁</title>
<style>
  :root{
    --bg1:#0f0c29;
    --bg2:#302b63;
    --bg3:#24243e;
    --accent:#ff3d68;
    --good:#39ff88;
    --bad:#ff4757;
    --gold:#ffd93d;
    --text:#f5f6fa;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--text);
    user-select:none;
    touch-action:none;
  }
  #wrap{
    position:relative; width:100%; height:100vh; display:flex;
    flex-direction:column; align-items:center; justify-content:flex-start;
  }
  #hud{
    width:100%; max-width:520px; display:flex; justify-content:space-between;
    align-items:center; padding:14px 18px; box-sizing:border-box; z-index:5;
  }
  .hud-box{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(6px);
    border-radius:14px;
    padding:8px 16px;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
    min-width:74px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.12);
  }
  #score{ color:var(--gold); }
  #combo{ color:var(--good); }
  #timer{ color:var(--accent); }
  #canvasHolder{
    position:relative;
    width:100%;
    max-width:520px;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{
    display:block;
    border-radius:20px;
    background:radial-gradient(circle at 50% 40%, rgba(255,255,255,0.05), rgba(0,0,0,0.25));
    box-shadow: 0 0 40px rgba(0,0,0,0.4), inset 0 0 60px rgba(0,0,0,0.3);
    touch-action:none;
  }
  #overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(10,8,30,0.85);
    text-align:center;
    padding:20px;
  }
  #overlay h1{
    font-size:34px; margin:0 0 6px; letter-spacing:1px;
    background:linear-gradient(90deg,var(--accent),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #overlay p{ margin:6px 0; color:#cfd0e8; font-size:14px; line-height:1.6; max-width:340px;}
  #overlay .big-score{ font-size:52px; font-weight:800; color:var(--gold); margin:8px 0; }
  .rule-tag{
    display:inline-block; margin:2px 4px; padding:4px 10px; border-radius:20px;
    font-size:12px; font-weight:700;
  }
  .tag-good{ background:rgba(57,255,136,0.15); color:var(--good); border:1px solid var(--good);}
  .tag-bad{ background:rgba(255,71,87,0.15); color:var(--bad); border:1px solid var(--bad);}
  .tag-gold{ background:rgba(255,217,61,0.15); color:var(--gold); border:1px solid var(--gold);}
  button{
    margin-top:18px;
    background:linear-gradient(90deg,var(--accent),#ff7a5c);
    border:none; color:white; font-weight:800; font-size:17px;
    padding:14px 38px; border-radius:30px; cursor:pointer;
    box-shadow:0 8px 20px rgba(255,61,104,0.4);
    transition:transform 0.15s ease;
  }
  button:active{ transform:scale(0.95); }
  #flash{
    position:absolute; inset:0; pointer-events:none; z-index:8;
    background:rgba(255,255,255,0); transition:background 0.08s ease;
  }
  #footer{
    color:rgba(255,255,255,0.35); font-size:11px; padding:10px; text-align:center;
  }
  #nickInput{
    margin-top:14px;
    width:220px;
    text-align:center;
    font-size:16px;
    font-weight:700;
    padding:12px 14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.08);
    color:var(--text);
    outline:none;
  }
  #nickInput::placeholder{ color:rgba(255,255,255,0.4); }
  #leaderboard{
    margin-top:10px;
    width:100%;
    max-width:300px;
    max-height:200px;
    overflow-y:auto;
    text-align:left;
    background:rgba(255,255,255,0.05);
    border-radius:14px;
    padding:10px 14px;
    font-size:13px;
  }
  #leaderboard h3{
    margin:2px 0 8px; font-size:13px; color:rgba(255,255,255,0.6);
    text-align:center; letter-spacing:1px;
  }
  #leaderboard ol{ margin:0; padding:0 0 0 22px; }
  #leaderboard li{ margin:4px 0; display:flex; justify-content:space-between; gap:10px; }
  #leaderboard li .lb-name{ color:#e6e7ff; }
  #leaderboard li .lb-score{ color:var(--gold); font-weight:700; }
  #leaderboard li.me{ color:var(--good); font-weight:800; }
  #lbStatus{ font-size:12px; color:rgba(255,255,255,0.5); margin-top:6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hud-box" id="score">0</div>
    <div class="hud-box" id="combo">x1</div>
    <div class="hud-box" id="timer">30</div>
  </div>
  <div id="canvasHolder">
    <canvas id="game"></canvas>
    <div id="flash"></div>
    <div id="overlay">
      <h1>🎯 타겟 블리츠</h1>
      <p><b>규칙이 계속 바뀝니다.</b><br>화면 상단의 지시를 보고 맞는 색의 과녁만 터치하세요.</p>
      <p>
        <span class="rule-tag tag-good">지시 색 = 정답</span>
        <span class="rule-tag tag-bad">틀린 색 = 감점</span>
        <span class="rule-tag tag-gold">금색 = 페이크! 절대 누르지 마세요</span>
      </p>
      <p>연속 성공 시 콤보 배율이 올라갑니다. 30초 동안 최고 점수에 도전하세요!</p>
      <input id="nickInput" type="text" maxlength="12" placeholder="닉네임 입력 (최대 12자)">
      <button id="startBtn">게임 시작</button>
      <div id="lbStatus"></div>
      <div id="leaderboard"></div>
    </div>
  </div>
  <div id="footer">탭/클릭으로 조준 · 리버스 룰에 주의하세요</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const timerEl = document.getElementById('timer');
  const flashEl = document.getElementById('flash');
  const holder = document.getElementById('canvasHolder');
  const nickInput = document.getElementById('nickInput');
  const lbStatus = document.getElementById('lbStatus');

  const SUPABASE_URL = 'https://zsxrwawpvgrynvwlnezc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_TzHHae1yP3XbzkrSiEqGOQ_aGGm8bv9';
  const SB_TABLE = 'target_blitz_scores';
  let lastNickname = '';

  async function submitScore(nickname, finalScore){
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    };
    try{
      const getRes = await fetch(
        `${SUPABASE_URL}/rest/v1/${SB_TABLE}?nickname=eq.${encodeURIComponent(nickname)}&select=id,score`,
        { headers }
      );
      const existing = await getRes.json();
      if(Array.isArray(existing) && existing.length > 0){
        const row = existing[0];
        if(finalScore > row.score){
          await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?id=eq.${row.id}`, {
            method:'PATCH', headers, body: JSON.stringify({ score: finalScore })
          });
        }
      } else {
        await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}`, {
          method:'POST', headers, body: JSON.stringify({ nickname, score: finalScore })
        });
      }
    }catch(e){
      console.warn('score submit failed', e);
    }
  }

  async function fetchLeaderboard(){
    const headers = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
    try{
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/${SB_TABLE}?select=nickname,score&order=score.desc&limit=20`,
        { headers }
      );
      return await res.json();
    }catch(e){
      console.warn('leaderboard fetch failed', e);
      return [];
    }
  }

  function renderLeaderboard(rows, myNickname, container){
    if(!rows || rows.length === 0){
      container.innerHTML = '<h3>🏆 랭킹</h3><div style="text-align:center;opacity:0.6;">아직 기록이 없어요. 첫 주인공이 되어보세요!</div>';
      return;
    }
    container.innerHTML = '<h3>🏆 랭킹 TOP 20</h3>';
    const ol = document.createElement('ol');
    rows.forEach((r)=>{
      const li = document.createElement('li');
      if(r.nickname === myNickname) li.className = 'me';
      const name = document.createElement('span');
      name.className = 'lb-name';
      name.textContent = r.nickname;
      const sc = document.createElement('span');
      sc.className = 'lb-score';
      sc.textContent = r.score;
      li.appendChild(name);
      li.appendChild(sc);
      ol.appendChild(li);
    });
    container.appendChild(ol);
  }

  let audioCtx = null;
  function beep(freq, dur, type='sine', vol=0.15){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }

  const COLORS = [
    {name:'레드', hex:'#ff4757', ring:'#ff6b81'},
    {name:'블루', hex:'#3d5cff', ring:'#6b8cff'},
    {name:'그린', hex:'#39ff88', ring:'#6bffab'},
    {name:'퍼플', hex:'#b03dff', ring:'#c96bff'},
  ];
  const GOLD = {name:'골드(페이크)', hex:'#ffd93d', ring:'#ffe98a'};

  function resize(){
    const w = Math.min(holder.clientWidth, 520);
    const h = holder.clientHeight;
    const size = Math.min(w, h);
    canvas.width = size * devicePixelRatio;
    canvas.height = size * devicePixelRatio;
    canvas.style.width = size+'px';
    canvas.style.height = size+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  window.addEventListener('resize', resize);

  let targets = [];
  let score = 0, combo = 1, timeLeft = 30;
  let running = false;
  let spawnTimer = 0, ruleTimer = 0;
  let currentRule = COLORS[0];
  let lastTime = 0;
  let animId = null;

  function size(){ return canvas.width / devicePixelRatio; }

  function spawnTarget(){
    const s = size();
    const r = 26 + Math.random()*14;
    const isFake = Math.random() < 0.22;
    const color = isFake ? GOLD : COLORS[Math.floor(Math.random()*COLORS.length)];
    const x = r + Math.random()*(s - r*2);
    const y = r + Math.random()*(s - r*2);
    const vx = (Math.random()-0.5) * 60;
    const vy = (Math.random()-0.5) * 60;
    targets.push({
      x,y,vx,vy,r, baseR:r, color, isFake,
      born: performance.now(), life: 1600 + Math.random()*800,
      hit:false, popT:0
    });
  }

  function newRule(){
    currentRule = COLORS[Math.floor(Math.random()*COLORS.length)];
  }

  function pickPointerPos(evt){
    const rect = canvas.getBoundingClientRect();
    const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX);
    const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY);
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function flash(color){
    flashEl.style.background = color;
    setTimeout(()=>{ flashEl.style.background='rgba(255,255,255,0)'; }, 90);
  }

  function handleShot(evt){
    if(!running) return;
    evt.preventDefault();
    const p = pickPointerPos(evt);
    let hitAny = false;
    for(let i = targets.length-1; i>=0; i--){
      const t = targets[i];
      if(t.hit) continue;
      const d = Math.hypot(p.x - t.x, p.y - t.y);
      if(d <= t.r){
        hitAny = true;
        t.hit = true;
        t.popT = performance.now();
        if(t.isFake){
          score = Math.max(0, score - 15);
          combo = 1;
          beep(120, 0.35, 'sawtooth', 0.2);
          flash('rgba(255,71,87,0.35)');
        } else if(t.color.name === currentRule.name){
          const gained = Math.round(10 * combo);
          score += gained;
          combo = Math.min(8, combo + 1);
          beep(520 + combo*40, 0.12, 'square', 0.12);
          flash('rgba(57,255,136,0.25)');
        } else {
          score = Math.max(0, score - 8);
          combo = 1;
          beep(180, 0.25, 'triangle', 0.18);
          flash('rgba(255,71,87,0.25)');
        }
        break;
      }
    }
    if(!hitAny){
      combo = 1;
    }
  }

  canvas.addEventListener('mousedown', handleShot);
  canvas.addEventListener('touchstart', handleShot, {passive:false});

  function update(dt, now){
    spawnTimer -= dt;
    if(spawnTimer <= 0 && targets.length < 6){
      spawnTarget();
      spawnTimer = 420 + Math.random()*380;
    }
    ruleTimer -= dt;
    if(ruleTimer <= 0){
      newRule();
      ruleTimer = 3200 + Math.random()*1400;
    }

    const s = size();
    for(let i = targets.length-1; i>=0; i--){
      const t = targets[i];
      if(t.hit){
        if(now - t.popT > 220) targets.splice(i,1);
        continue;
      }
      t.x += t.vx * dt/1000;
      t.y += t.vy * dt/1000;
      if(t.x - t.r < 0 || t.x + t.r > s) t.vx *= -1;
      if(t.y - t.r < 0 || t.y + t.r > s) t.vy *= -1;
      t.x = Math.max(t.r, Math.min(s-t.r, t.x));
      t.y = Math.max(t.r, Math.min(s-t.r, t.y));
      if(now - t.born > t.life){
        targets.splice(i,1);
      }
    }
  }

  function draw(now){
    const s = size();
    ctx.clearRect(0,0,s,s);

    // rule banner
    ctx.save();
    ctx.font = '700 15px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('지금 눌러야 할 색', s/2, 24);
    ctx.font = '800 20px Segoe UI, sans-serif';
    ctx.fillStyle = currentRule.hex;
    ctx.fillText('● ' + currentRule.name, s/2, 48);
    ctx.restore();

    for(const t of targets){
      const life = (now - t.born) / t.life;
      let r = t.r;
      let alpha = 1;
      if(t.hit){
        const p = Math.min(1, (now - t.popT)/220);
        r = t.r * (1 + p*1.4);
        alpha = 1 - p;
      } else if(life > 0.8){
        alpha = 1 - (life-0.8)/0.2;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      const grad = ctx.createRadialGradient(t.x,t.y,r*0.1,t.x,t.y,r);
      grad.addColorStop(0, '#fff');
      grad.addColorStop(0.25, t.color.ring);
      grad.addColorStop(0.55, t.color.hex);
      grad.addColorStop(0.75, '#fff');
      grad.addColorStop(1, t.color.hex);
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.stroke();
      if(t.isFake){
        ctx.font = '800 11px Segoe UI';
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.textAlign = 'center';
        ctx.fillText('FAKE', t.x, t.y+4);
      }
      ctx.restore();
    }
  }

  function loop(now){
    if(!running) return;
    if(!lastTime) lastTime = now;
    const dt = now - lastTime;
    lastTime = now;
    update(dt, now);
    draw(now);
    scoreEl.textContent = score;
    comboEl.textContent = 'x' + combo;
    animId = requestAnimationFrame(loop);
  }

  let countdownInterval = null;
  function startGame(){
    const nickEl = document.getElementById('nickInput');
    const nick = (nickEl ? nickEl.value : lastNickname).trim();
    if(!nick){
      if(nickEl){
        nickEl.style.borderColor = 'var(--bad)';
        nickEl.placeholder = '닉네임을 입력해주세요!';
        nickEl.focus();
      }
      return;
    }
    lastNickname = nick.slice(0,12);
    resize();
    targets = [];
    score = 0; combo = 1; timeLeft = 30;
    spawnTimer = 0; ruleTimer = 0; lastTime = 0;
    newRule();
    overlay.style.display = 'none';
    scoreEl.textContent = '0';
    comboEl.textContent = 'x1';
    timerEl.textContent = timeLeft;
    running = true;
    animId = requestAnimationFrame(loop);
    countdownInterval = setInterval(()=>{
      timeLeft -= 1;
      timerEl.textContent = timeLeft;
      if(timeLeft <= 0){
        endGame();
      }
    }, 1000);
  }

  async function endGame(){
    running = false;
    clearInterval(countdownInterval);
    cancelAnimationFrame(animId);
    const finalScore = score;
    const nick = lastNickname;
    overlay.innerHTML = `
      <h1>⏱ 타임 오버!</h1>
      <div class="big-score">${finalScore}</div>
      <p id="submitMsg">랭킹에 점수 등록 중...</p>
      <div id="leaderboard"></div>
      <input id="nickInput" type="text" maxlength="12" placeholder="닉네임 입력 (최대 12자)" value="${nick.replace(/"/g,'')}">
      <button id="startBtn">다시 도전</button>
    `;
    overlay.style.display = 'flex';
    document.getElementById('startBtn').addEventListener('click', startGame);
    // re-bind nickInput reference to the new element in the DOM
    window.nickInputEl = document.getElementById('nickInput');

    await submitScore(nick, finalScore);
    const msg = document.getElementById('submitMsg');
    if(msg) msg.textContent = '점수가 등록됐어요! 순위를 확인해보세요.';
    const rows = await fetchLeaderboard();
    const lbEl = document.getElementById('leaderboard');
    if(lbEl) renderLeaderboard(rows, nick, lbEl);
  }

  startBtn.addEventListener('click', startGame);
  window.addEventListener('load', resize);
  resize();
  fetchLeaderboard().then(rows=>{
    const lbEl = document.getElementById('leaderboard');
    if(lbEl) renderLeaderboard(rows, '', lbEl);
  });
})();
</script>
</body>
</html>
